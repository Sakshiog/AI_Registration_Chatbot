version: "3.1"

rules:

- rule: Say hello
  steps:
    - intent: greet
    - action: utter_greet

- rule: Say goodbye
  steps:
    - intent: goodbye
    - action: utter_goodbye

- rule: Start registration
  steps:
    - intent: register
    - action: action_start_registration

- rule: Provide name during registration
  steps:
    - intent: provide_name
    - action: action_validate_registration

- rule: Provide email during registration
  steps:
    - intent: provide_email
    - action: action_validate_registration

- rule: Provide phone during registration
  steps:
    - intent: provide_phone
    - action: action_validate_registration

- rule: Provide education during registration
  steps:
    - intent: provide_education
    - action: action_validate_registration

- rule: Provide city during registration
  steps:
    - intent: provide_city
    - action: action_validate_registration
    - action: action_save_registration

- rule: Registration status
  steps:
    - intent: ask_registration_status
    - action: action_check_registration

- rule: Answer eligibility
  steps:
    - intent: ask_eligibility
    - action: utter_eligibility

- rule: Respond to help request
  steps:
    - intent: ask_help
    - action: utter_ask_help

- rule: Edit registration
  steps:
    - intent: ask_edit_registration
    - action: action_start_edit_registration

- rule: Cancel registration
  steps:
    - intent: ask_cancel_registration
    - action: action_start_cancel_registration

- rule: FAQ
  steps:
    - intent: faq
    - action: action_handle_faq

- rule: Positive sentiment
  steps:
    - intent: mood_positive
    - action: utter_positive

- rule: Negative sentiment
  steps:
    - intent: mood_negative
    - action: utter_negative

- rule: Out of scope
  steps:
    - intent: out_of_scope
    - action: action_gemini_fallback

- rule: Fallback
  steps:
    - intent: nlu_fallback
    - action: action_gemini_fallback
